<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOCA - Iniciar sesion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/boca-theme.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a5f 0%, #152d4a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .icono {
            width: 64px;
            height: 64px;
            background-color: var(--naranja);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin: 0 auto 14px;
            box-shadow: 0 8px 24px rgba(243,156,18,0.35);
        }

        .login-logo h1 {
            color: #fff;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .login-logo p {
            color: rgba(255,255,255,0.55);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .login-card {
            background: #fff;
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .login-card h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--texto);
            margin-bottom: 24px;
        }

        .login-card .form-control {
            padding-left: 38px;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gris);
            font-size: 0.95rem;
        }

        .select-rol {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--borde);
            border-radius: 6px;
            font-size: 0.88rem;
            color: var(--texto);
            background-color: #fff;
            outline: none;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .select-rol:focus {
            border-color: var(--azul);
            box-shadow: 0 0 0 3px rgba(41,128,185,0.12);
        }

        .btn-login {
            width: 100%;
            padding: 11px;
            background-color: var(--azul);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-login:hover {
            background-color: var(--azul-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(41,128,185,0.3);
        }

        .alerta-error {
            background-color: rgba(231,76,60,0.08);
            border: 1px solid rgba(231,76,60,0.25);
            color: var(--danger);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.84rem;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255,255,255,0.4);
            font-size: 0.78rem;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-logo">
            <div class="icono">B</div>
            <h1>BOCA</h1>
            <p>Sistema de administracion de competencias</p>
        </div>

        <div class="login-card">
            <h2>Iniciar sesion</h2>

            <div class="alerta-error" id="alerta-error">
                <i class="bi bi-exclamation-circle"></i>
                <span id="msg-error">Usuario o contrasena incorrectos.</span>
            </div>

            <form id="form-login" novalidate>
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <div class="input-icon">
                        <i class="bi bi-person"></i>
                        <input type="text" id="usuario" class="form-control"
                               placeholder="Ingresa tu usuario"
                               data-requerido autocomplete="username">
                        <div class="form-error"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="contrasena">Contrasena</label>
                    <div class="input-icon">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="contrasena" class="form-control"
                               placeholder="Ingresa tu contrasena"
                               data-requerido autocomplete="current-password">
                        <div class="form-error"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="rol">Tipo de acceso</label>
                    <select id="rol" class="select-rol">
                        <option value="admin">Administrador</option>
                        <option value="juez">Juez</option>
                        <option value="equipo">Equipo / Competidor</option>
                        <option value="staff">Staff</option>
                    </select>
                </div>

                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Ingresar
                </button>
            </form>
        </div>

        <div class="login-footer">
            BOCA Online Contest Administrator &mdash; Politecnico Grancolombiano
        </div>
    </div>

    <script src="js/boca-theme.js"></script>
    <script>
        document.getElementById('form-login').addEventListener('submit', function (e) {
            e.preventDefault();

            const usuario    = document.getElementById('usuario');
            const contrasena = document.getElementById('contrasena');
            const alerta     = document.getElementById('alerta-error');

            let valido = true;
            if (!usuario.value.trim()) {
                usuario.classList.add('is-invalid');
                usuario.nextElementSibling.style.display = 'block';
                usuario.nextElementSibling.textContent = 'Ingresa tu usuario.';
                valido = false;
            } else {
                usuario.classList.remove('is-invalid');
                usuario.classList.add('is-valid');
            }

            if (!contrasena.value.trim()) {
                contrasena.classList.add('is-invalid');
                contrasena.nextElementSibling.style.display = 'block';
                contrasena.nextElementSibling.textContent = 'Ingresa tu contrasena.';
                valido = false;
            } else {
                contrasena.classList.remove('is-invalid');
                contrasena.classList.add('is-valid');
            }

            if (!valido) return;

            // Simulacion de login (en produccion Boca valida contra su BD)
            const creds = { admin: 'boca2026', juez: 'juez123', equipo: 'team123', staff: 'staff123' };
            const rol = document.getElementById('rol').value;

            if (creds[rol] === contrasena.value) {
                window.location.href = 'admin/dashboard.html';
            } else {
                alerta.style.display = 'flex';
                contrasena.classList.add('is-invalid');
                contrasena.classList.remove('is-valid');
                setTimeout(() => alerta.style.display = 'none', 4000);
            }
        });

        ['usuario', 'contrasena'].forEach(id => {
            document.getElementById(id).addEventListener('input', function () {
                this.classList.remove('is-invalid');
                const err = this.parentElement.querySelector('.form-error');
                if (err) err.style.display = 'none';
            });
        });
    </script>
</body>
</html>
